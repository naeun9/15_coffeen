<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../common/15_coffeen_common.css">
    <link rel="stylesheet" href="15_coffeen_write.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
</head>
<body data-current-page="write">
    <header class="coffeen-header">
        <div class="header-inner">
            <a href="#" class="header-logo">
                <img src="../assets/images/15_logo.png" alt="header-logo">
                
            </a>
            <nav class="header-nav">
                <a href="../home/15_coffen_home.html" class="nav-item" data-page="home">home</a>
                <a href="../explore/15_cofeen_explore.html" class="nav-item" data-page="explore">explore</a>
                <a href="../map/15_coffeen_map.html" class="nav-item" data-page="map">map</a>
                <a href="../write/15_coffeen_write.html" class="nav-item" data-page="write">write</a>
                <a href="../mypage/15_coffeen_board.html" class="nav-item" data0page="mypage">mypage</a>
            </nav>
        </div>
    </header>

    <main class="review_container">
        <header class="review_title">
            <h1 class="title">카페 후기 작성하기</h1>
        </header>
        <article class="review_card">
            

            <form id="review_form">
                <section class="photo_area">
                    
                    <label class="form_label">사진 업로드</label>
                    <input type="file" id="real-upload" hidden multiple accept="image/*">
                    <div class="upload_card">
                        <button type="button" class="upload_btn" id="custom-upload-btn" aria-label="사진 추가하기">
                            <span class="material-symbols-outlined">upload</span>
                            <span class="upload_text">사진 추가</span>
                        </button>
                        <div id="preview-container" class="preview_container"></div>
                    </div>
                    <p class="guide">최대 4장까지 업로드 가능합니다</p>
                </section>

                <section class="info_area">
                    <div class="inputs">
                        <label for="name" class="form_label">카페 이름</label>
                        <input type="text" id="name" class="form_input" placeholder="카페 이름을 입력하세요" required>
                    </div>

                    <div class="inputs">
                        <label for="where" class="form_label">위치</label>
                        <div class="where_group">
                            <img src="../assets/icons/15_icon_location.svg" alt="위치" class="where_icon">
                            
                            <input type="text" id="where" class="form_input" placeholder="주소를 입력하세요" required>
                            
                            <a href="../map/15_coffeen_map.html" class="map">지도에서 찾기</a>
                        </div>
                    </div>
                </section>

                <fieldset class="rate_area">
                    <legend class="form_label">별점</legend>
                    <div class="star_rating" id="star_container">
                        <span class="material-symbols-outlined star" data-value="1">star</span>
                        <span class="material-symbols-outlined star" data-value="2">star</span>
                        <span class="material-symbols-outlined star" data-value="3">star</span>
                        <span class="material-symbols-outlined star" data-value="4">star</span>
                        <span class="material-symbols-outlined star" data-value="5">star</span>
                    </div>
                    <input type="hidden" id="rate_result" name="rating" value="0" required>
                </fieldset>

                <section class="text_area">
                    <label for="review_text" class="form_label">후기</label>
                    <textarea id="review_text" class="form_text" placeholder="이 카페에 대한 당신의 경험을 공유해주세요..." maxlength="500" required></textarea>
                    <div class="count">
                        <span id="now_count">0</span> / 500
                    </div>
                </section>

                <fieldset class="hashtag_area">
                    <legend class="form_label">해시태그</legend>
                    <div class="tag_list">
                        <button type="button" class="tag_btn">#공부</button>
                        <button type="button" class="tag_btn">#모던</button>
                        <button type="button" class="tag_btn">#아늑한</button>
                        <button type="button" class="tag_btn">#자연</button>
                        <button type="button" class="tag_btn">#맛집</button>
                        <button type="button" class="tag_btn">#빈티지</button>
                        <button type="button" class="tag_btn">#힐링</button>
                        <button type="button" class="tag_btn">#루프탑</button>
                        <button type="button" class="tag_btn">#베이커리</button>
                        <button type="button" class="tag_btn">#감성</button>
                    </div>
                </fieldset>
                
                <footer class="last_area">
                    <a href="../mypage/15_coffeen_review.html">
                        <button type="button" class="second_btn">임시저장</button>
                    </a>
                    <a href="../mypage/15_coffeen_review.html">
                        <button type="submit" class="first_btn">후기 등록하기</button>
                    </a>

                </footer>
            </form>
        </article>
    </main>
    <script src="../common/15_coffeen_common.js"></script>
    <script src="15_coffeen_write.js"></script>
    
    
    
</body>
</html>
