<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>회원가입</title>
  <link rel="stylesheet" href="15_coffeen_signup.css" />
</head>

<body>
  <div class="wrapper">
    <main class="container">

      <header class="title-section">
        <h1>계정을 생성하세요</h1>
        <p>이미 계정이 있으신가요?
          <a href="../login/15_coffeen_login.html">로그인</a>
        </p>
      </header>

      <form id="signupForm" class="signup-form">

        <label for="id">아이디</label>
        <input id="id" required />

        <label for="email">이메일</label>
        <input id="email" type="email" required />

        <label for="phone">전화번호</label>
        <input id="phone" placeholder="000-0000-0000" required />

        <div class="pw-row">
          <div>
            <label for="password">비밀번호</label>
            <input id="password" type="password" required />
          </div>

          <div>
            <label for="confirm">비밀번호 확인</label>
            <input id="confirm" type="password" required />
          </div>
        </div>

        <p class="pw-ex">4자 이상의 문자, 숫자를 조합해 주세요.</p>

        <label for="profileName">프로필 이름</label>
        <input id="profileName" required />

        <label for="preferredArea">선호 지역</label>
        <select id="preferredArea" required>
          <option value="" disabled selected>지역 선택</option>
          <option>용산구</option>
          <option>마포구</option>
          <option>성동구</option>
          <option>중구</option>
          <option>동작구</option>
        </select>

        <button type="submit" class="next-btn">회원가입 완료</button>

      </form>

    </main>
  </div>

  <script src="15_coffeen_signup.js"></script>
</body>
</html>
