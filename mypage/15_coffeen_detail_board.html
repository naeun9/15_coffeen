<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Coffeen - My Page</title>
  <link rel="stylesheet" href="../common/15_coffeen_common.css" />
  <link rel="stylesheet" href="15_coffeen_board.css" />
  <link rel="stylesheet" href="15_coffeen_detail_board.css" />
</head>
<body data-current-page="mypage">
  <header class="coffeen-header">
    <div class="header-inner">
      <a href="../home/15_coffeen_home.html" class="header-logo">
        <img src="../assets/images/15_logo.png" alt="Coffeen 로고" />
      </a>
      <nav class="header-nav">
        <a href="../home/15_coffeen_home.html" class="nav-item" data-page="home">home</a>
        <a href="../explore/15_coffeen_explore.html" class="nav-item" data-page="explore">explore</a>
        <a href="../map/15_coffeen_map.html" class="nav-item" data-page="map">map</a>
        <a href="../write/15_coffeen_write.html" class="nav-item" data-page="write">write</a>
        <a href="../mypage/15_coffeen_review.html" class="nav-item" data-page="mypage">my page</a>
      </nav>
    </div>
  </header>

  <main class="mypage-container">
    <section class="profile-card">
      <div class="profile-avatar"></div>
      <div class="profile-info">
        <h1 class="profile-name">카페러버</h1>
        <p class="profile-bio">커피와 카페를 사랑하는 사람</p>
        <div class="profile-stats">
          <div class="profile-stat">
            <span class="stat-number">3</span>
            <span class="stat-label">후기</span>
          </div>
          <div class="profile-stat">
            <span class="stat-number">3</span>
            <span class="stat-label">저장</span>
          </div>
          <div class="profile-stat">
            <span class="stat-number">35</span>
            <span class="stat-label">팔로워</span>
          </div>
          <div class="profile-stat">
            <span class="stat-number">234</span>
            <span class="stat-label">팔로잉</span>
          </div>
        </div>
      </div>
    </section>

    <section class="mypage-tabs">
      <button type="button" class="tab-button" data-tab="reviews">
        <span class="tab-icon" aria-hidden="true"></span>
        <span>내 후기</span>
      </button>
      <button type="button" class="tab-button" data-tab="saved">
        <span class="tab-icon" aria-hidden="true"></span>
        <span>저장한 카페</span>
      </button>
      <button type="button" class="tab-button is-active" data-tab="board">
        <span class="tab-icon" aria-hidden="true"></span>
        <span>내 보드</span>
      </button>
    </section>

    <section class="board-detail">
      <header class="board-detail-header">
        <div>
          <h2 class="board-detail-title" id="board-detail-title">데이트하기 좋은 카페</h2>
          <span class="board-detail-count" id="board-detail-count">4개 카페</span>
        </div>
        <div class="board-detail-actions">
          <button
            type="button"
            class="board-detail-btn board-detail-add-btn"
            id="board-add-cafe-btn"
          >
            카페 추가
          </button>
          <button type="button" class="board-detail-btn" id="board-edit-toggle">편집</button>
          <button type="button" class="board-detail-btn" id="board-back-btn">보드 목록</button>
        </div>
      </header>

      <div class="board-detail-list">
        <!-- JS에서 렌더링 -->
      </div>
    </section>
    <!-- 보드에 카페 추가 팝업 -->
    <div class="popup-overlay" id="detail-board-popup-overlay">
      <div class="popup-container">
        <header class="popup-header">
          <h2 class="popup-title">보드에 카페 추가</h2>
          <button type="button" class="popup-close" id="detail-popup-close" aria-label="닫기">✕</button>
        </header>

        <section class="popup-body">
          <div class="popup-field popup-field-list">
            <div class="popup-list-header">
              <span class="popup-label">추가할 카페 선택</span>
              <span class="popup-selected-count" id="detail-popup-selected-count">0개 선택됨</span>
            </div>

            <ul class="popup-cafe-list" id="detail-popup-cafe-list">
              <li class="popup-cafe-item">
                <label class="popup-cafe-row">
                  <input type="checkbox" class="popup-cafe-checkbox" />
                  <div class="popup-cafe-card">
                    <img src="../assets/images/15_cafe1.jpeg" alt="더 베이커리" class="popup-cafe-thumb" />
                    <div class="popup-cafe-info">
                      <p class="popup-cafe-name">더 베이커리</p>
                      <p class="popup-cafe-address">용산구 · 브런치가 맛있는 감성 카페</p>
                    </div>
                  </div>
                </label>
              </li>
              <li class="popup-cafe-item">
                <label class="popup-cafe-row">
                  <input type="checkbox" class="popup-cafe-checkbox" />
                  <div class="popup-cafe-card">
                    <img src="../assets/images/15_cafe2.jpeg" alt="선샤인 테라스" class="popup-cafe-thumb" />
                    <div class="popup-cafe-info">
                      <p class="popup-cafe-name">선샤인 테라스</p>
                      <p class="popup-cafe-address">마포구 · 햇살 좋은 우드톤 카페</p>
                    </div>
                  </div>
                </label>
              </li>
              <li class="popup-cafe-item">
                <label class="popup-cafe-row">
                  <input type="checkbox" class="popup-cafe-checkbox" />
                  <div class="popup-cafe-card">
                    <img src="../assets/images/15_cafe3.jpeg" alt="모노브루 라운지" class="popup-cafe-thumb" />
                    <div class="popup-cafe-info">
                      <p class="popup-cafe-name">모노브루 라운지</p>
                      <p class="popup-cafe-address">성동구 · 커피가 맛있는 조용한 카페</p>
                    </div>
                  </div>
                </label>
              </li>
              <li class="popup-cafe-item">
                <label class="popup-cafe-row">
                  <input type="checkbox" class="popup-cafe-checkbox" />
                  <div class="popup-cafe-card">
                    <img src="../assets/images/15_cafe4.jpeg" alt="라이트웨이 커피바" class="popup-cafe-thumb" />
                    <div class="popup-cafe-info">
                      <p class="popup-cafe-name">라이트웨이 커피바</p>
                      <p class="popup-cafe-address">중구 · 주황색 인테리어의 트렌디한 카페</p>
                    </div>
                  </div>
                </label>
              </li>
              <li class="popup-cafe-item">
                <label class="popup-cafe-row">
                  <input type="checkbox" class="popup-cafe-checkbox" />
                  <div class="popup-cafe-card">
                    <img src="../assets/images/15_cafe6.jpeg" alt="코지 코너" class="popup-cafe-thumb" />
                    <div class="popup-cafe-info">
                      <p class="popup-cafe-name">코지 코너</p>
                      <p class="popup-cafe-address">용산구 · 다양한 종류의 베이커리가 있는 카페</p>
                    </div>
                  </div>
                </label>
              </li>
            </ul>
          </div>
        </section>

        <footer class="popup-footer">
          <button type="button" class="popup-btn popup-btn-cancel" id="detail-popup-cancel">취소</button>
          <button type="button" class="popup-btn popup-btn-primary" id="detail-popup-add">추가하기</button>
        </footer>
      </div>
    </div>

  </main>

  <script src="../common/15_coffeen_common.js"></script>
  <script src="15_coffeen_detail_board.js"></script>
</body>
</html>
